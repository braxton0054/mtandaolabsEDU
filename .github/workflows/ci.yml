name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-typecheck-unit

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mtandaolabsedu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mtandaolabsedu_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mtandaolabsedu_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-test-secret-not-used-anywhere-else-32chars
      TRUSTED_ORIGINS: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /tmp/mlabs-storage
      BACKUP_DRIVER: local
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-typecheck-unit

    env:
      NODE_ENV: production
      APP_URL: https://staging.mtandaolabs.com
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mtandaolabsedu_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mtandaolabsedu_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-build-only-secret-not-used-anywhere-else
      TRUSTED_ORIGINS: https://staging.mtandaolabs.com
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /tmp/mlabs-storage
      BACKUP_DRIVER: local
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mtandaolabsedu_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mtandaolabsedu_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-e2e-secret-not-used-anywhere-else-32chars
      TRUSTED_ORIGINS: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /tmp/mlabs-storage
      BACKUP_DRIVER: local
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run E2E
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7